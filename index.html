<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Prepositions Flashcards - Complete</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: white;
            color: #667eea;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .btn.active {
            background: #ffd700;
            color: #333;
        }

        .card-container {
            perspective: 1000px;
            margin-bottom: 30px;
        }

        .flashcard {
            width: 100%;
            height: 400px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card-front {
            background: white;
            color: #333;
        }

        .card-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform: rotateY(180deg);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .card-content {
            font-size: 48px;
            font-weight: 700;
            text-align: center;
            line-height: 1.4;
        }

        .card-note {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
            font-style: italic;
        }

        .progress {
            text-align: center;
            color: white;
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .navigation {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .nav-btn {
            padding: 15px 30px;
            font-size: 18px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 700;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .nav-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hint {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 16px;
            opacity: 0.9;
        }

        .shuffle-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .shuffle-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .flashcard {
                height: 350px;
            }

            .card-content {
                font-size: 36px;
            }

            .btn {
                padding: 10px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎴 Complete German Prepositions</h1>
        
        <div class="controls">
            <button class="btn btn-primary active" onclick="setCategory('an_dativ')">AN + Dativ</button>
            <button class="btn btn-primary" onclick="setCategory('an_akk')">AN + Akkusativ</button>
            <button class="btn btn-primary" onclick="setCategory('auf_dativ')">AUF + Dativ</button>
            <button class="btn btn-primary" onclick="setCategory('auf_akk')">AUF + Akkusativ</button>
            <button class="btn btn-primary" onclick="setCategory('in_dativ')">IN + Dativ</button>
            <button class="btn btn-primary" onclick="setCategory('in_akk')">IN + Akkusativ</button>
            <button class="btn btn-primary" onclick="setCategory('bei')">BEI + Dativ</button>
            <button class="btn btn-primary" onclick="setCategory('zu')">ZU + Dativ</button>
            <button class="btn btn-primary" onclick="setCategory('von')">VON + Dativ</button>
            <button class="btn btn-primary" onclick="setCategory('aus')">AUS + Dativ</button>
            <button class="btn btn-primary" onclick="setCategory('nach')">NACH + Dativ</button>
            <button class="btn btn-primary" onclick="setCategory('hause')">HAUSE Trio ⭐</button>
        </div>

        <div style="text-align: center; margin-bottom: 20px;">
            <button class="shuffle-btn" onclick="shuffleCards()">🔀 Shuffle Cards</button>
        </div>

        <div class="progress" id="progress">Card 1 of 10</div>

        <div class="card-container">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="card-face card-front">
                    <div class="card-title">English</div>
                    <div class="card-content" id="frontContent">at the train station</div>
                    <div class="card-note">Click to reveal German 👆</div>
                </div>
                <div class="card-face card-back">
                    <div class="card-title">Deutsch</div>
                    <div class="card-content" id="backContent">am Bahnhof</div>
                    <div class="card-note" id="backNote">an + Dativ (Wo?)</div>
                </div>
            </div>
        </div>

        <div class="navigation">
            <button class="nav-btn" onclick="previousCard()" id="prevBtn">← Previous</button>
            <button class="nav-btn" onclick="nextCard()" id="nextBtn">Next →</button>
        </div>

        <div class="hint">💡 Keyboard: ← → to navigate, Space/Enter to flip</div>
    </div>

    <script>
        const flashcards = {
            an_dativ: [
                { front: "at the train station", back: "am Bahnhof", note: "an + Dativ (Wo?)" },
                { front: "at the bus stop", back: "an der Haltestelle", note: "an + Dativ (Wo?)" },
                { front: "at university", back: "an der Uni", note: "an + Dativ (Wo?) - Exception!" },
                { front: "at the beach", back: "am Strand", note: "an + Dativ (Wo?)" },
                { front: "at the sea", back: "am Meer", note: "an + Dativ (Wo?)" },
                { front: "at the water", back: "am Wasser", note: "an + Dativ (Wo?)" },
                { front: "at the window", back: "am Fenster", note: "an + Dativ (Wo?)" },
                { front: "at the computer", back: "am Computer", note: "an + Dativ (Wo?)" },
                { front: "on the phone", back: "am Telefon", note: "an + Dativ (Wo?)" },
                { front: "on board", back: "an Board", note: "an + Dativ (Wo?)" }
            ],
            an_akk: [
                { front: "to Lake Constance", back: "an den Bodensee", note: "an + Akkusativ (Wohin?)" },
                { front: "to the coast", back: "an die Küste", note: "an + Akkusativ (Wohin?)" },
                { front: "to the sea", back: "ans Meer", note: "an + Akkusativ (Wohin?)" }
            ],
            auf_dativ: [
                { front: "at the square", back: "auf dem Platz", note: "auf + Dativ (Wo?)" },
                { front: "at the playground", back: "auf dem Spielplatz", note: "auf + Dativ (Wo?)" },
                { front: "at the party", back: "auf der Party", note: "auf + Dativ (Wo?) - Exception!" },
                { front: "at the bank", back: "auf der Bank", note: "auf + Dativ (Wo?) - Exception!" },
                { front: "at the post office", back: "auf der Post", note: "auf + Dativ (Wo?) - Exception!" },
                { front: "at the high school", back: "auf dem Gymnasium", note: "auf + Dativ (Wo?) - Exception!" },
                { front: "on the mountain", back: "auf dem Berg", note: "auf + Dativ (Wo?)" },
                { front: "on the meadow", back: "auf der Wiese", note: "auf + Dativ (Wo?)" },
                { front: "in the field", back: "auf dem Feld", note: "auf + Dativ (Wo?)" },
                { front: "in the countryside", back: "auf dem Land", note: "auf + Dativ (Wo?)" },
                { front: "on the way", back: "auf dem Weg", note: "auf + Dativ (Wo?)" },
                { front: "on the ship", back: "auf dem Schiff", note: "auf + Dativ (Wo?)" },
                { front: "on the picture", back: "auf dem Bild", note: "auf + Dativ (Wo?)" },
                { front: "on the city map", back: "auf dem Stadtplan", note: "auf + Dativ (Wo?)" },
                { front: "on the phone (mobile)", back: "auf dem Handy", note: "auf + Dativ (Wo?)" },
                { front: "on the map", back: "auf der Landkarte", note: "auf + Dativ (Wo?)" }
            ],
            auf_akk: [
                { front: "to the market", back: "auf den Markt", note: "auf + Akkusativ (Wohin?)" },
                { front: "to the island", back: "auf die Insel", note: "auf + Akkusativ (Wohin?)" },
                { front: "to high school", back: "aufs Gymnasium", note: "auf + Akkusativ (Wohin?)" },
                { front: "to the countryside", back: "aufs Land", note: "auf + Akkusativ (Wohin?)" }
            ],
            in_dativ: [
                { front: "in the room", back: "im Zimmer", note: "in + Dativ (Wo?)" },
                { front: "in the park", back: "im Park", note: "in + Dativ (Wo?)" },
                { front: "at the zoo", back: "im Zoo", note: "in + Dativ (Wo?)" },
                { front: "in the supermarket", back: "im Supermarkt", note: "in + Dativ (Wo?)" },
                { front: "in the garden", back: "im Garten", note: "in + Dativ (Wo?)" },
                { front: "in the church", back: "in der Kirche", note: "in + Dativ (Wo?)" },
                { front: "at the disco", back: "in der Disko", note: "in + Dativ (Wo?)" },
                { front: "at school", back: "in der Schule", note: "in + Dativ (Wo?)" },
                { front: "on the street", back: "in der Straße", note: "in + Dativ (Wo?)" },
                { front: "in the city", back: "in der Stadt", note: "in + Dativ (Wo?)" },
                { front: "at the cinema", back: "im Kino", note: "in + Dativ (Wo?)" },
                { front: "at the restaurant", back: "im Restaurant", note: "in + Dativ (Wo?)" },
                { front: "at the swimming pool", back: "im Schwimmbad", note: "in + Dativ (Wo?)" },
                { front: "in the water", back: "im Wasser", note: "in + Dativ (Wo?)" },
                { front: "in the air", back: "in der Luft", note: "in + Dativ (Wo?)" },
                { front: "in the forest", back: "im Wald", note: "in + Dativ (Wo?)" },
                { front: "in the Black Forest", back: "im Schwarzwald", note: "in + Dativ (Wo?)" },
                { front: "in the mountains", back: "in den Bergen", note: "in + Dativ (Wo?)" },
                { front: "in Berlin", back: "in Berlin", note: "in + Dativ (Wo?)" },
                { front: "in Germany", back: "in Deutschland", note: "in + Dativ (Wo?)" },
                { front: "in Switzerland", back: "in der Schweiz", note: "in + Dativ (Wo?) - with article!" },
                { front: "in Turkey", back: "in der Türkei", note: "in + Dativ (Wo?) - with article!" },
                { front: "in the north/west", back: "im Norden/Westen", note: "in + Dativ (Wo?)" }
            ],
            in_akk: [
                { front: "to the park", back: "in den Park", note: "in + Akkusativ (Wohin?)" },
                { front: "to the cinema", back: "ins Kino", note: "in + Akkusativ (Wohin?)" },
                { front: "to the city", back: "in die Stadt", note: "in + Akkusativ (Wohin?)" },
                { front: "to high school", back: "ins Gymnasium", note: "in + Akkusativ (Wohin?)" },
                { front: "into the forest", back: "in den Wald", note: "in + Akkusativ (Wohin?)" },
                { front: "to Switzerland", back: "in die Schweiz", note: "in + Akkusativ (Wohin?) - with article!" },
                { front: "to the USA", back: "in die USA", note: "in + Akkusativ (Wohin?) - with article!" }
            ],
            bei: [
                { front: "near/at the university", back: "bei der Uni", note: "bei + Dativ (Wo?)" },
                { front: "at the doctor's", back: "beim Arzt", note: "bei + Dativ (Wo?)" },
                { front: "at the hairdresser's", back: "beim Friseur", note: "bei + Dativ (Wo?)" },
                { front: "at grandma's", back: "bei der Oma", note: "bei + Dativ (Wo?)" },
                { front: "at BMW (working)", back: "bei BMW", note: "bei + Dativ (Wo?)" }
            ],
            zu: [
                { front: "to the train station", back: "zum Bahnhof", note: "zu + Dativ (Wohin?) ⭐" },
                { front: "to the police", back: "zur Polizei", note: "zu + Dativ (Wohin?)" },
                { front: "to university", back: "zur Uni", note: "zu + Dativ (Wohin?) ⭐" },
                { front: "to school", back: "zur Schule", note: "zu + Dativ (Wohin?) ⭐" },
                { front: "to the doctor", back: "zum Arzt", note: "zu + Dativ (Wohin?) ⭐" },
                { front: "to the hairdresser", back: "zum Friseur", note: "zu + Dativ (Wohin?)" },
                { front: "to grandma's", back: "zur Oma", note: "zu + Dativ (Wohin?)" },
                { front: "to Tina's", back: "zu Tina", note: "zu + Dativ (Wohin?)" },
                { front: "to the airport", back: "zum Flughafen", note: "zu + Dativ (Wohin?)" },
                { front: "to grandpa's", back: "zum Opa", note: "zu + Dativ (Wohin?)" },
                { front: "at home", back: "zu Hause", note: "FIXED EXPRESSION! ⚠️" },
                { front: "to the department store", back: "zum Kaufhaus", note: "zu + Dativ (Wohin?)" }
            ],
            von: [
                { front: "from the train station", back: "vom Bahnhof", note: "von + Dativ (Woher?)" },
                { front: "from school", back: "von der Schule", note: "von + Dativ (Woher?)" },
                { front: "from the cinema", back: "vom Kino", note: "von + Dativ (Woher?)" },
                { front: "from the city", back: "von der Stadt", note: "von + Dativ (Woher?)" },
                { front: "from home", back: "von zu Hause", note: "FIXED EXPRESSION! ⚠️" },
                { front: "from Peter", back: "von Peter", note: "von + Dativ (Woher?)" }
            ],
            aus: [
                { front: "from India", back: "aus Indien", note: "aus + Dativ (Woher?)" },
                { front: "from the supermarket", back: "aus dem Supermarkt", note: "aus + Dativ (Woher?) - enclosed" },
                { front: "from Switzerland", back: "aus der Schweiz", note: "aus + Dativ (Woher?)" },
                { front: "from the USA", back: "aus den USA", note: "aus + Dativ (Woher?)" },
                { front: "from Berlin", back: "aus Berlin", note: "aus + Dativ (Woher?) - cities" },
                { front: "from Germany", back: "aus Deutschland", note: "aus + Dativ (Woher?) - countries" },
                { front: "from the city (out)", back: "aus der Stadt", note: "aus + Dativ (Woher?) - coming OUT" }
            ],
            nach: [
                { front: "to Berlin", back: "nach Berlin", note: "nach + Dativ (Wohin?) - cities" },
                { front: "to Germany", back: "nach Deutschland", note: "nach + Dativ (Wohin?) - countries" },
                { front: "to Paris", back: "nach Paris", note: "nach + Dativ (Wohin?) - cities" },
                { front: "home (going)", back: "nach Hause", note: "FIXED EXPRESSION! ⚠️" },
                { front: "abroad", back: "ins Ausland", note: "Exception: in + Akkusativ!" }
            ],
            hause: [
                { front: "going home (to)", back: "nach Hause", note: "MOVEMENT TO! ⭐" },
                { front: "at home (being)", back: "zu Hause", note: "STATIC LOCATION! ⭐" },
                { front: "from home (from)", back: "von zu Hause", note: "MOVEMENT FROM! ⭐" }
            ]
        };

        let currentCategory = 'an_dativ';
        let currentIndex = 0;
        let isFlipped = false;
        let currentCards = [...flashcards[currentCategory]];

        function setCategory(category) {
            currentCategory = category;
            currentIndex = 0;
            isFlipped = false;
            currentCards = [...flashcards[category]];
            
            document.querySelectorAll('.btn-primary').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            updateCard();
        }

        function shuffleCards() {
            for (let i = currentCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentCards[i], currentCards[j]] = [currentCards[j], currentCards[i]];
            }
            currentIndex = 0;
            updateCard();
        }

        function updateCard() {
            const card = currentCards[currentIndex];
            
            document.getElementById('frontContent').textContent = card.front;
            document.getElementById('backContent').textContent = card.back;
            document.getElementById('backNote').textContent = card.note;
            document.getElementById('progress').textContent = `Card ${currentIndex + 1} of ${currentCards.length}`;
            
            document.getElementById('flashcard').classList.remove('flipped');
            isFlipped = false;
            
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === currentCards.length - 1;
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        function nextCard() {
            if (currentIndex < currentCards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function previousCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') previousCard();
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });

        updateCard();
    </script>
</body>
</html>
